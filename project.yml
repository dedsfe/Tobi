name: Tobi
options:
  bundleIdPrefix: com.andrefelipe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # App em português: datas, números e textos do sistema saem em pt-BR.
  developmentLanguage: pt-BR
packages:
  # Só registra as compras pro painel de receita e pros anúncios. Quem decide o acesso continua sendo a App Store.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.94.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4ZQ8PBTL5U
targets:
  Tobi:
    type: application
    platform: iOS
    sources:
      - Tobi
      # Ícone feito no Icon Composer (Liquid Glass): o Xcode compila direto do arquivo .icon.
      - path: Asset-Icon/TobiIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrefelipe.tobi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tobi
        INFOPLIST_KEY_NSCameraUsageDescription: "O Tobi usa a câmera pra ler o código de barras dos produtos."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "O Tobi usa o microfone pra você ditar o que comeu."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "O Tobi transforma sua fala em texto pra registrar as refeições."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Só a criptografia do próprio iOS (HTTPS): a App Store não pergunta a cada build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: TobiIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  TobiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TobiTests]
    dependencies:
      - target: Tobi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TobiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TobiUITests]
    dependencies:
      - target: Tobi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tobi:
    build:
      targets:
        Tobi: all
        TobiTests: [test]
        TobiUITests: [test]
    run:
      # Compras de teste ao rodar pelo Xcode. No aparelho sem o Xcode, o paywall mostra os preços de reserva.
      storeKitConfiguration: Tobi.storekit
    test:
      targets: [TobiTests, TobiUITests]
